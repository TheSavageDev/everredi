steps:
  # Install dependencies and run unit tests (fail build if tests fail)
  - name: 'node:24-alpine'
    entrypoint: 'npm'
    args: ['ci']
    dir: '.'

  - name: 'node:24-alpine'
    entrypoint: 'npm'
    args: ['test']
    dir: '.'

  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/everredi-api-dev:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/everredi-api-dev:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/everredi-api-dev:$SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/everredi-api-dev:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'everredi-api-dev'
      - '--image'
      - 'gcr.io/$PROJECT_ID/everredi-api-dev:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production,CORS_ORIGIN=${_CORS_ORIGIN},NO_COLOR=not-empty'
      - '--set-secrets'
      - 'SUPABASE_URL=supabase-url-${_ENV}:latest,SUPABASE_SECRET_KEY=supabase-secret-key-${_ENV}:latest,STRIPE_SECRET_KEY=stripe-secret-key-${_ENV}:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret-${_ENV}:latest,GEMINI_API_KEY=gemini-api-key-${_ENV}:latest,REVENUECAT_SECRET_API_KEY=revenuecat-secret-api-key-${_ENV}:latest,REVENUECAT_WEBHOOK_SECRET=revenuecat-webhook-secret-${_ENV}:latest'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _ENV: 'dev'
  _CORS_ORIGIN: 'https://dev.everredi.app'

timeout: '1200s'
