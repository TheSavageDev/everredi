steps:
  # Install dependencies
  - name: 'node:24-alpine'
    entrypoint: 'npm'
    args: ['ci']
    dir: '.'

  # Run linting
  - name: 'node:24-alpine'
    entrypoint: 'npm'
    args: ['run', 'lint']
    dir: '.'

  # Run tests
  - name: 'node:24-alpine'
    entrypoint: 'npm'
    args: ['test']
    dir: '.'

  # Build application
  - name: 'node:24-alpine'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: '.'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
