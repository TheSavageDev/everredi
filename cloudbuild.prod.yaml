steps:
  # Extract version from tag (prod_1.0.0 -> 1.0.0)
  - name: 'bash'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        VERSION=$${TAG_NAME#prod_}
        echo "$$VERSION" > /workspace/version.txt
        echo "Building version: $$VERSION"

  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/everredi-api-prod:$$VERSION'
      - '-t'
      - 'gcr.io/$PROJECT_ID/everredi-api-prod:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    env:
      - 'VERSION=$(cat /workspace/version.txt)'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/everredi-api-prod:$$VERSION'
    env:
      - 'VERSION=$(cat /workspace/version.txt)'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/everredi-api-prod:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'everredi-api-prod'
      - '--image'
      - 'gcr.io/$PROJECT_ID/everredi-api-prod:$$VERSION'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production,FIREBASE_PROJECT_ID=$PROJECT_ID,FIREBASE_DATABASE_ID=${_DATABASE_ID},CORS_ORIGIN=${_CORS_ORIGIN}'
      - '--set-secrets'
      - 'FIREBASE_PRIVATE_KEY=firebase-private-key-${_ENV}:latest,FIREBASE_CLIENT_EMAIL=firebase-client-email-${_ENV}:latest,STRIPE_SECRET_KEY=stripe-secret-key-${_ENV}:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret-${_ENV}:latest,GEMINI_API_KEY=gemini-api-key-${_ENV}:latest,REVENUECAT_SECRET_API_KEY=revenuecat-secret-api-key-${_ENV}:latest'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300'
    env:
      - 'VERSION=$(cat /workspace/version.txt)'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

substitutions:
  VERSION: ''
  _ENV: 'prod'
  _DATABASE_ID: 'prod'
  _CORS_ORIGIN: 'https://everredi.com'

timeout: '1200s'
